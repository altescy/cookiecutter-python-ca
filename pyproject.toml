[project]
name = "cookiecutter-python-ca"
version = "0.1.0"
description = "Cookiecutter template for Python Clean Architecture projects"
readme = "README.md"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "cookiecutter>=2.7.1",
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
timeout = 300

[tool.ruff]
line-length = 120
